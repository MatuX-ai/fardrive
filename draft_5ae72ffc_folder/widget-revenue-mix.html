<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="use-iframe" content="true">
<meta name="html-box-height-mode" content="auto">
<meta name="description" content="平台收入结构预测：启动期与成熟期的四线收入构成占比">
<title>平台收入结构预测</title>
</head>
<body style="margin:0;padding:0;font-family:'Roboto','PingFang SC','Segoe UI',Arial,sans-serif;background:transparent;">
<div style="width:100%;max-width:100%;box-sizing:border-box;padding:4px 2px;color:#1A1B1C;">
  <div style="font-size:15px;font-weight:600;margin-bottom:2px;">平台收入结构 · 启动期 vs 成熟期（预测）</div>
  <div style="font-size:12px;color:#6B7280;margin-bottom:12px;">构成占比为商业预测假设，非历史数据；以实际运营后财务数据替代</div>

  <div style="display:flex;align-items:center;margin-bottom:8px;">
    <div style="width:56px;font-size:12px;color:#374151;flex-shrink:0;">启动期</div>
    <div style="flex:1;display:flex;height:26px;border-radius:6px;overflow:hidden;">
      <div style="width:40%;background:#1A2B4A;display:flex;align-items:center;justify-content:center;"><span style="font-size:11px;color:#FFFFFF;">使用分成 40%</span></div>
      <div style="width:35%;background:#758092;display:flex;align-items:center;justify-content:center;"><span style="font-size:11px;color:#FFFFFF;">加盟相关 35%</span></div>
      <div style="width:15%;background:#BABFC9;display:flex;align-items:center;justify-content:center;"><span style="font-size:11px;color:#1A1B1C;">硬件 15%</span></div>
      <div style="width:10%;background:#DDE0E4;display:flex;align-items:center;justify-content:center;"><span style="font-size:11px;color:#1A1B1C;">商城 10%</span></div>
    </div>
  </div>

  <div style="display:flex;align-items:center;margin-bottom:12px;">
    <div style="width:56px;font-size:12px;color:#374151;flex-shrink:0;">成熟期</div>
    <div style="flex:1;display:flex;height:26px;border-radius:6px;overflow:hidden;">
      <div style="width:45%;background:#1A2B4A;display:flex;align-items:center;justify-content:center;"><span style="font-size:11px;color:#FFFFFF;">使用分成 45%</span></div>
      <div style="width:25%;background:#758092;display:flex;align-items:center;justify-content:center;"><span style="font-size:11px;color:#FFFFFF;">加盟相关 25%</span></div>
      <div style="width:15%;background:#BABFC9;display:flex;align-items:center;justify-content:center;"><span style="font-size:11px;color:#1A1B1C;">硬件 15%</span></div>
      <div style="width:15%;background:#DDE0E4;display:flex;align-items:center;justify-content:center;"><span style="font-size:11px;color:#1A1B1C;">商城 15%</span></div>
    </div>
  </div>

  <div style="font-size:12px;color:#6B7280;line-height:1.6;border-top:1px solid #E4E3DD;padding-top:8px;">
    逻辑：使用分成（探索局/比赛局按次20-30%）为经常性收入主体；加盟相关（认证车/图传套件+管理费）启动期占比高、成熟期下降；硬件（先兼容通用外设、后自研认证硬件）与商城（粘性验证后上线）为后置增量。占比为预测假设。
  </div>
</div>
</body>
</html>
