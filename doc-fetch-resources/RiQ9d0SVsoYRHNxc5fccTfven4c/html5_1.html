<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="use-iframe" content="true">
<meta name="html-box-height-mode" content="auto">
<meta name="description" content="单店经济模型三情景：保守、基准、乐观情景下的加盟商月度收入与回本周期估算">
<title>单店经济模型（估算）</title>
</head>
<body style="margin:0;padding:0;font-family:'Roboto','PingFang SC','Segoe UI',Arial,sans-serif;background:transparent;">
<div style="width:100%;max-width:100%;box-sizing:border-box;padding:4px 2px;color:#1A1B1C;">
  <div style="font-size:15px;font-weight:600;margin-bottom:2px;">单店经济模型 · 三情景估算</div>
  <div style="font-size:12px;color:#6B7280;margin-bottom:12px;">基数：10台分档车 · 加盟商分成75% · 单场15-40元（分档混合）；估算数据，需试点校准</div>

  <div style="display:flex;align-items:center;margin-bottom:10px;">
    <div style="width:56px;font-size:12px;color:#374151;flex-shrink:0;">保守</div>
    <div style="flex:1;background:#EEF0F3;border-radius:6px;height:26px;position:relative;overflow:hidden;">
      <div style="width:17%;height:26px;background:#1A2B4A;border-radius:6px;"></div>
    </div>
    <div style="width:120px;text-align:right;font-size:12px;flex-shrink:0;color:#1A1B1C;">≈0.9万/月 · 回本约4个月</div>
  </div>

  <div style="display:flex;align-items:center;margin-bottom:10px;">
    <div style="width:56px;font-size:12px;color:#374151;flex-shrink:0;">基准</div>
    <div style="flex:1;background:#EEF0F3;border-radius:6px;height:26px;position:relative;overflow:hidden;">
      <div style="width:52%;height:26px;background:#1A2B4A;border-radius:6px;"></div>
    </div>
    <div style="width:120px;text-align:right;font-size:12px;flex-shrink:0;color:#1A1B1C;">≈2.8万/月 · 回本约1.5个月</div>
  </div>

  <div style="display:flex;align-items:center;margin-bottom:12px;">
    <div style="width:56px;font-size:12px;color:#374151;flex-shrink:0;">乐观</div>
    <div style="flex:1;background:#EEF0F3;border-radius:6px;height:26px;position:relative;overflow:hidden;">
      <div style="width:100%;height:26px;background:#1A2B4A;border-radius:6px;"></div>
    </div>
    <div style="width:120px;text-align:right;font-size:12px;flex-shrink:0;color:#1A1B1C;">≈5.4万/月 · 回本约1个月</div>
  </div>

  <div style="font-size:12px;color:#6B7280;line-height:1.6;border-top:1px solid #E4E3DD;padding-top:8px;">
    口径：保守=单车日均2场·均价20元；基准=单车日均5场·均价25元；乐观=单车日均8场·均价30元。初始投入2-4万元（10台车+套件+简易改造）。条形长度为相对示意，实际以直营示范点数据校准。
  </div>
</div>
</body>
</html>
